name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) has no Python 3.9 build for setup-python; 24.04 still does
        os: [windows-latest, ubuntu-24.04]
        python: ['3.9', '3.12']
        numpy: ['numpy<2', 'numpy>=2']
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.numpy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "${{ matrix.numpy }}" matplotlib customtkinter pytest
      # The GUI tests open the real window on Windows; on Linux runners (no display) they are skipped.
      - run: python -m pytest -rs
